name: AINexLayer Pages

# Builds the feed from the newest main and deploys it to GitHub Pages.
#
# Pushes made with the workflow token start no other workflow, so the intake,
# gate and publish workflows call this one after their bot commit and pass
# the commit they pushed as `published_sha`. The job always checks out main
# as it is when the job starts (never the caller's older event commit) and
# refuses to deploy a build that does not contain `published_sha`.
#
# One job, one concurrency group, no cancelling of a running deploy: a
# waiting run that GitHub replaces is harmless, because the run that does
# start builds whatever main is at that moment.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      published_sha:
        description: Commit the caller just pushed; the deployed feed must contain it.
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  deploy:
    name: Build and deploy the feed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write # Pages deployment authenticates with OIDC
    concurrency:
      group: ainexlayer-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: The build contains the published commit
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
        run: |
          set -eu
          if [ -n "${PUBLISHED_SHA:-}" ]; then
            if ! printf '%s' "$PUBLISHED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::published_sha is not a full commit sha"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$PUBLISHED_SHA" HEAD; then
              echo "::error::main does not contain the published commit"
              exit 1
            fi
          fi
          echo "Building main at $(git rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # The shared validation library brings requirements-ci.txt and
      # export_rules.py; these steps start running as soon as it lands.
      - name: Install hash-pinned dependencies
        if: hashFiles('requirements-ci.txt') != ''
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-ci.txt
      - name: Validate the registry tree
        run: python -I scripts/validate.py
      - name: Rules file is current
        if: hashFiles('scripts/export_rules.py') != ''
        run: python -I scripts/export_rules.py --check
      - name: Feed is current
        run: |
          python -I scripts/compile_index.py
          git diff --exit-code -- docs/index.json docs/rules.json \
            || { echo "::error::docs/ on main is stale"; exit 1; }
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
