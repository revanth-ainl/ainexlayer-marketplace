name: AINexLayer Auto-merge Gate

# Decides whether a submission pull request may merge without a maintainer.
# Off unless the repository variable AINEXLAYER_AUTOMERGE is "true".
#
# pull_request_target runs THIS file and the scripts from main, with a write
# token. That is only safe because nothing from the pull request is ever
# checked out, imported or run: scripts/automerge_gate.py fetches the PR head
# as git objects and reads the single submissions/<name>.json blob as bytes.
# tests/test_workflows.py fails if this job ever checks out the PR head.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] base-branch code only; PR content is read as data
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions: {}

jobs:
  gate:
    name: Check and merge a submission
    if: vars.AINEXLAYER_AUTOMERGE == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the pull request and push the publish commit
      pull-requests: write # comment on and label the pull request
    concurrency:
      group: gate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      published_sha: ${{ steps.gate.outputs.published_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-ci.txt
      - id: gate
        name: Evaluate, merge and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I scripts/automerge_gate.py

  pages:
    name: Deploy the feed
    needs: gate
    if: needs.gate.outputs.published_sha != ''
    permissions:
      contents: read
      pages: write # passed to pages.yml to deploy
      id-token: write # passed to pages.yml for the OIDC deployment token
    uses: ./.github/workflows/pages.yml
    with:
      published_sha: ${{ needs.gate.outputs.published_sha }}
