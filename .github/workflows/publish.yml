name: AINexLayer Publish

# Publishes submissions that reached main through a maintainer-merged pull
# request (auto-merge is off by default). The publisher is the author of the
# pull request that produced the pushed commit, looked up through the API; a
# submission pushed directly to main has no such author and is refused.
#
# Bot commits made with the workflow token do not start this workflow, so it
# never loops on its own expansion commit. A maintainer can re-run it for one
# commit on main with workflow_dispatch after a "publish-failed" result.

on:
  push:
    branches: [main]
    paths: ["submissions/**"]
  workflow_dispatch:
    inputs:
      sha:
        description: Full sha of a commit on main whose submission changes should be published
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Expand and publish merged submissions
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bot's publish commit to main
      pull-requests: write # report the result on the merged pull request
    concurrency:
      group: publish-${{ inputs.sha || github.sha }}
      cancel-in-progress: false
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-ci.txt
      - id: publish
        name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I scripts/publish.py

  pages:
    name: Deploy the feed
    needs: publish
    if: needs.publish.outputs.published_sha != ''
    permissions:
      contents: read
      pages: write # passed to pages.yml to deploy
      id-token: write # passed to pages.yml for the OIDC deployment token
    uses: ./.github/workflows/pages.yml
    with:
      published_sha: ${{ needs.publish.outputs.published_sha }}
