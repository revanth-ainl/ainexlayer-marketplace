name: AINexLayer Intake

# Publishes a submission that arrives as an issue (the desktop app's publish
# path, and the issue form). Off unless the repository variable
# AINEXLAYER_INTAKE is "true".
#
# Trusted code only: the issues event always runs this file from the default
# branch, and the checkout below is main. The issue body is read from the
# event file by Python as data; it is never put into a shell command. The
# publisher is the issue's author as GitHub authenticated it, never a value
# from the body.

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  intake:
    name: Publish a submission from an issue
    if: >-
      vars.AINEXLAYER_INTAKE == 'true' &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, '[publish]')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bot's publish commit to main
      issues: write # comment on, label and close the publish issue
    concurrency:
      group: intake-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    outputs:
      published_sha: ${{ steps.intake.outputs.published_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-ci.txt
      - id: intake
        name: Validate and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I scripts/intake.py

  pages:
    name: Deploy the feed
    needs: intake
    if: needs.intake.outputs.published_sha != ''
    permissions:
      contents: read
      pages: write # passed to pages.yml to deploy
      id-token: write # passed to pages.yml for the OIDC deployment token
    uses: ./.github/workflows/pages.yml
    with:
      published_sha: ${{ needs.intake.outputs.published_sha }}
