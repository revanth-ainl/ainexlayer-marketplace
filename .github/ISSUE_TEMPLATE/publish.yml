name: Publish package
description: Submit a skill, plugin or agent template to the AINexLayer Marketplace
title: "[publish] "
labels: ["publish"]
body:
  - type: markdown
    attributes:
      value: |
        AIAgentLayer opens this issue for you when you publish from the app. Use this form only to publish by hand.

        Paste one submission object below and keep the title starting with `[publish]`.
        A maintainer reviews it and publishes it by hand; nothing is published automatically.
        The GitHub account that opens this issue is recorded as the publisher.

        Never paste API keys, tokens or passwords. Credentials in an MCP config must be placeholders.
  - type: textarea
    id: submission
    attributes:
      label: Submission JSON
      description: One JSON object with kind, name, version and the package fields. The form wraps it in a json code block.
      render: json
      placeholder: |
        {
          "kind": "skill",
          "name": "my-skill",
          "version": "1.0.0",
          "title": "My skill",
          "description": "One sentence on what it does.",
          "categories": ["productivity"],
          "skill_md": "---\nname: my-skill\ndescription: One sentence on what it does.\n---\n\n# My skill\n"
        }
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Publisher agreement
      options:
        - label: I have the right to publish this package, and it contains no secrets or credentials.
          required: true
        - label: I understand it is listed as an unreviewed community package and users confirm before installing it.
          required: true
